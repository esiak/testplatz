name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/state/**'
      - 'data/public/**'
  pull_request:
    paths-ignore:
      - 'data/state/**'
      - 'data/public/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
