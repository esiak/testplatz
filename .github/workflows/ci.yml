name: ci

# snapshot.json and data/state/ are bot-written; places.json is operator-built and read by
# committed-data tests, so a change to it is checked like code (Story 1.12).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/state/**'
      - 'data/public/snapshot.json'
  pull_request:
    paths-ignore:
      - 'data/state/**'
      - 'data/public/snapshot.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:directory
      - run: npm test
      - run: npm run build
