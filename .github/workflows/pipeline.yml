name: pipeline

on:
  # Once a day at 05:17 UTC (operator decision 2026-10-29; freshness threshold 36 h). Only the
  # schedule and a manual dispatch collect (Story 3.11): a push to main tests, builds and deploys
  # the pushed SHA from the committed data, so code changes use none of the sites' visit budget.
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

# Each job gets only what it needs: publish may push data/state/ and data/public/ to main, build
# holds no write token while it runs third-party install scripts, and only deploy gets the
# Pages/OIDC token.
permissions:
  contents: read

jobs:
  # Test, run the pipeline (saving this run's reader results), then commit data/state/ and
  # data/public/ once (if they changed) and push them to main. Collects on schedule and dispatch
  # only, from the current tip of main (a run queued behind another sees that run's visits).
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      # For the monitor job (Story 3.4): the failed stage (empty on success) and the run report.
      stage: ${{ steps.stage.outputs.stage }}
      report: ${{ steps.stage.outputs.report }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: install
        run: npm ci
      - id: typecheck
        run: npm run typecheck
      - id: test
        run: npm test
      - id: pipeline
        run: npm run pipeline -- --save-collect "$RUNNER_TEMP/collect.json" --report "$RUNNER_TEMP/report.json" --save-visits "$RUNNER_TEMP/visits.json"
      - id: commit
        name: Commit and push data/state/ and data/public/
        env:
          GH_TOKEN: ${{ github.token }}
          # After a rejected push the script rebases onto an upstream that changed only the data
          # folders; otherwise it resets onto the moved upstream and replays merge + publish from
          # this run's saved reader results (no refetch). Type-check and test that code before
          # publishing it, as the steps above did for this commit. No `npm ci`
          # here: the push credential sits in this step's and the script's initial environment
          # (readable through /proc/<pid>/environ by any child), so install scripts must never run
          # in this step. The retry reuses node_modules from the `npm ci` step above; if upstream
          # changed dependencies, the tests fail, this run fails without deploying, and the queued
          # run for that upstream push publishes instead.
          PUBLISH_CMD: npm run typecheck && npm test && npm run pipeline -- --from-collect "$RUNNER_TEMP/collect.json" --report "$RUNNER_TEMP/report.json"
        run: |
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          unset GH_TOKEN
          GIT_AUTH_HEADER="AUTHORIZATION: basic $basic" .github/scripts/commit-public.sh
      # After the commit, so this run's visits.json and data are kept; failing here skips build and
      # deploy, and the monitor job files "Pipeline failed: every fetched centre failed".
      - id: all-failed
        name: Fail when every fetched centre failed
        run: |
          report="$RUNNER_TEMP/report.json"
          if [ ! -f "$report" ]; then
            echo "::warning::no run report at $report"
          elif [ "$(jq -r '.all_fetched_failed' "$report")" = true ]; then
            echo "::error::every fetched centre failed; the data was committed, nothing is deployed"
            exit 1
          fi
      # When the job failed or was cancelled (or timed out) after contacting sites (collect threw,
      # publish failed, the push was rejected for good, …), this run's visits are not on main yet: reset to the newest main, add
      # them to data/state/visits.json and push only that file, so the visit budget never
      # under-counts (Story 3.11). Idempotent: visits already on main change nothing. No `npm ci`
      # here either (the push credential is in this step's environment).
      - id: record-visits
        name: Record this run's visits on main after a failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_CMD: node pipeline/stages/record-visits.ts "$RUNNER_TEMP/visits.json"
        run: |
          visits="$RUNNER_TEMP/visits.json"
          if [ ! -f "$visits" ] || [ "$(jq -c . "$visits" 2>/dev/null || true)" = '[]' ]; then
            echo "no visits from this run, nothing to record"
            exit 0
          fi
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          unset GH_TOKEN
          GIT_AUTH_HEADER="AUTHORIZATION: basic $basic" .github/scripts/commit-visits.sh
      # Names the first failed stage for the monitor job and passes the run report on.
      - id: stage
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_NODE: ${{ steps.setup-node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          ALL_FAILED: ${{ steps.all-failed.outcome }}
        run: |
          file="$RUNNER_TEMP/report.json"
          report="$(jq -c . "$file" 2>/dev/null || true)"
          stage=''
          if [ "$CHECKOUT" = failure ] || [ "$SETUP_NODE" = failure ] || [ "$INSTALL" = failure ]; then
            stage='setup'
          elif [ "$TYPECHECK" = failure ] || [ "$TEST" = failure ]; then
            stage='tests'
          elif [ "$PIPELINE" = failure ]; then
            stage="$(printf '%s' "$report" | jq -r '.stage // empty' 2>/dev/null || true)"
            # No report (e.g. bad CLI arguments): an input error.
            if [ -z "$stage" ]; then stage='input'; fi
          elif [ "$COMMIT" = failure ]; then
            # A replay after a rejected push rewrites the report; its failing stage wins.
            stage="$(printf '%s' "$report" | jq -r '.stage // empty' 2>/dev/null || true)"
            if [ -z "$stage" ]; then stage='push'; fi
          elif [ "$ALL_FAILED" = failure ]; then
            stage='every fetched centre failed'
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

  # On schedule/dispatch: build exactly the SHA the publish job pushed (pushes made with the
  # workflow token do not trigger another workflow run, so there is no loop); publish tested it.
  # On a push to main: publish is skipped; build type-checks, tests and builds the pushed SHA with
  # the committed data (no provider site or Nominatim is contacted). `always()`, because a skipped
  # publish would otherwise skip build and deploy too.
  build:
    needs: publish
    if: >-
      always() && (needs.publish.result == 'success' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Nothing else tested a pushed SHA (ci.yml skips data-only pushes); publish tested its own.
      - if: github.event_name == 'push'
        run: npm run typecheck
      - if: github.event_name == 'push'
        run: npm test
      - run: npm run build
      - name: Check build output
        run: |
          for file in dist/index.html dist/about/index.html dist/snapshot.json dist/places.json; do
            if [ ! -f "$file" ]; then
              echo "::error::missing $file"
              exit 1
            fi
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Alerts (Story 3.4): opens or comments on a "Pipeline failed: <stage>" issue for a failed run,
  # opens, comments on or closes one "Reader <reader>: needs attention" issue per reader system,
  # and pings the dead-man check (healthchecks.io) after a fully successful run (a publish skipped
  # on a push counts as successful; such a run has no report, so reader issues are left alone). No
  # `npm ci`: no install scripts run next to the issues token; tools/alerts.ts imports only Node
  # built-ins.
  monitor:
    needs: [publish, build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: alerts
        name: Open, comment on or close alert issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE: ${{ needs.publish.outputs.stage }}
          REPORT: ${{ needs.publish.outputs.report }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: node tools/alerts.ts
      # `ping` is written before any issue call, so a failed issue call never stops the ping.
      - name: Ping the dead-man check
        if: always() && steps.alerts.outputs.ping == 'true'
        env:
          DEADMAN_PING_URL: ${{ secrets.DEADMAN_PING_URL }}
        run: |
          if [ -z "$DEADMAN_PING_URL" ]; then
            echo "::warning::DEADMAN_PING_URL is not set; no dead-man ping sent"
          elif ! curl -fsS -m 10 --retry 3 "$DEADMAN_PING_URL" > /dev/null; then
            echo "::warning::the dead-man ping failed"
          fi
